name: Stakker Transition (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label(s) as JSON-encoded string. Single: ''"blacksmith-2vcpu-ubuntu-2404"''. Array: ''["self-hosted","ci"]''.'
        type: string
        default: '"blacksmith-2vcpu-ubuntu-2404"'
    secrets:
      STAKKER_API_URL:
        required: true
      STAKKER_API_TOKEN:
        required: true

jobs:
  transition:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - name: Transition task to done
        env:
          BRANCH: ${{ github.head_ref }}
          STAKKER_API: ${{ secrets.STAKKER_API_URL }}
          STAKKER_TOKEN: ${{ secrets.STAKKER_API_TOKEN }}
        run: |
          REF=$(echo "$BRANCH" | tr '[:lower:]' '[:upper:]')
          # only a task reference (PREFIX-NNN) may reach the URL path
          if ! [[ "$REF" =~ ^[A-Z0-9]+-[0-9]+$ ]]; then
            echo "Branch '$BRANCH' is not a Stakker task reference; nothing to transition."
            exit 0
          fi
          echo "Transitioning task $REF to done..."
          curl -sf -X POST "${STAKKER_API}/api/v1/tasks/${REF}/transition" \
            -H "Authorization: Bearer ${STAKKER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"status": "done", "comment": "PR merged to main via GitHub."}' \
            || echo "Warning: Could not transition task $REF (may not exist or already done)"
