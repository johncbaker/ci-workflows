name: Semgrep (reusable)

on:
  workflow_call:
    inputs:
      min-severity:
        description: Minimum severity to ingest (error|warning|note|none)
        type: string
        default: warning
      stakker-cli-ref:
        description: Git ref of stakker-cli to install (branch, tag, or SHA)
        type: string
        default: main
      runs-on:
        description: 'Runner label(s) as JSON-encoded string. Single: ''"blacksmith-2vcpu-ubuntu-2404"''. Array: ''["self-hosted","ci"]''.'
        type: string
        default: '"blacksmith-2vcpu-ubuntu-2404"'
    secrets:
      STAKKER_CLI_PAT:
        required: true
      STAKKER_API_TOKEN:
        required: true
      STAKKER_API_URL:
        required: true

jobs:
  scan:
    runs-on: ${{ fromJSON(inputs.runs-on) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Show Semgrep version
        run: semgrep --version

      - name: Run Semgrep scan
        continue-on-error: true
        run: semgrep scan --config=p/default --sarif --output=findings.sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-findings-${{ github.run_id }}
          path: findings.sarif
          if-no-files-found: warn

      - name: Setup Node
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Stakker CLI
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          PAT: ${{ secrets.STAKKER_CLI_PAT }}
          REF: ${{ inputs.stakker-cli-ref }}
        run: |
          AUTH_B64=$(printf "x-access-token:%s" "$PAT" | base64 -w0)
          CLI_DIR="${RUNNER_TEMP:-/tmp}/stakker-cli"
          rm -rf "$CLI_DIR"
          git -c "http.https://github.com/.extraheader=Authorization: Basic $AUTH_B64" \
            clone --depth 1 --branch "$REF" https://github.com/omnixi/stakker-cli.git "$CLI_DIR"
          cd "$CLI_DIR"
          npm install --no-audit --no-fund
          npm install -g .

      - name: Ingest findings into Stakker
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          STAKKER_API_TOKEN: ${{ secrets.STAKKER_API_TOKEN }}
          STAKKER_API_URL: ${{ secrets.STAKKER_API_URL }}
        run: |
          stakker semgrep ingest findings.sarif \
            --repo ${{ github.repository }} \
            --min-severity ${{ inputs.min-severity }}
